<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Signal</title>
<link rel="stylesheet" href="style.css" />
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="eyebrow">AI SIGNAL · ежедневный дайджест</div>
      <h1><a href="index.html">AI Signal</a></h1>
    </header>

    <main id="article">
      <div class="loading">Загружаю…</div>
    </main>
  </div>

  <script>
    const CATEGORY_CLASS = { labs: 'labs', research: 'research', news: 'news', tools: 'tools' };

    function formatDate(d) {
      return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function load() {
      const slug = new URLSearchParams(location.search).get('slug');
      const article = document.getElementById('article');
      if (!slug) {
        article.innerHTML = `<div class="empty">Дайджест не указан.</div>`;
        return;
      }

      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.AI_DIGEST_CONFIG;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/digests?select=*&slug=eq.${encodeURIComponent(slug)}`,
        { headers: { apikey: SUPABASE_ANON_KEY, authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );

      if (!res.ok) {
        article.innerHTML = `<div class="empty">Не удалось загрузить дайджест (${res.status}).</div>`;
        return;
      }

      const [d] = await res.json();
      if (!d) {
        article.innerHTML = `<div class="empty">Дайджест не найден.</div>`;
        return;
      }

      document.title = `${d.title} — AI Signal`;

      const sourcesHtml = (d.sources || []).map(s => `
        <li><span class="src-name">${(s.name || '').toUpperCase()}</span><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>
      `).join('');

      article.innerHTML = `
        <div class="article">
          <div class="article-meta">${formatDate(d.date)} · ${(d.sources || []).length} источников</div>
          <h1>${d.title}</h1>
          <div class="article-body">${marked.parse(d.body_markdown)}</div>
        </div>
        <div class="sources-box">
          <h3>Источники</h3>
          <ul>${sourcesHtml}</ul>
        </div>
        <a class="back-link" href="index.html">← Все дайджесты</a>
      `;
    }

    load();
  </script>
</body>
</html>
